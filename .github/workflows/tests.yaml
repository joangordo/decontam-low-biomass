# Runs the unit tests on every push and pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: |
          install.packages(c("BiocManager", "testthat", "dplyr", "tidyr", "ggplot2"))
          BiocManager::install("decontam", update = FALSE, ask = FALSE)
        shell: Rscript {0}
      - name: Run tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
